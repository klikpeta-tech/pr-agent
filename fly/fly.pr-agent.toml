# Fly.io config for pr-agent webhook server (https://github.com/The-PR-Agent/pr-agent)
# Deploy with: fly deploy --config fly/fly.pr-agent.toml --app klikpeta-pr-agent

app = 'klikpeta-pr-agent'
primary_region = 'sin'

[build]
  dockerfile = 'pr-agent.Dockerfile'

[env]
  # Free-tier token counters live on the volume below, so they survive a deploy.
  # Without this they would sit in /tmp and reset on every image change, handing
  # the proxy a full tier-1 budget it has not actually spent.
  QUOTA_STATE_PATH = '/data/openai-quota-state.json'

[mounts]
  source = 'pr_agent_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
